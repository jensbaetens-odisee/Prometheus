[project]
name = "prometheus"
version = "0.2.0"
description = "Local agentic AI on Ollama with clean architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.12.20240808",
]

[project.scripts]
local-agents = "local_agents.presentation.cli.app:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "ollama: tests that require a running Ollama instance",
    "outlook: tests that require Outlook desktop",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local_agents"]
mypy_path = "src"
